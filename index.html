 if(!isTeacherPage&&!room)return <div className={outer}><div className={panel+' max-w-md mx-auto mt-16 text-center'}><h1 className="text-xl font-bold text-military-gold mb-4">THAM GIA CUỘC ĐUA GIẢI MẬT MÃ</h1><p className="text-sm mb-4">Quét QR hoặc nhập mã phòng giáo viên cung cấp.</p><input className="w-full p-3 bg-military-900 border border-military-gold/40 rounded-lg mb-3 text-center uppercase" value={roomInput} maxLength={8} onChange={e=>setRoomInput(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''))} placeholder="MÃ PHÒNG"/><button className={goldButton+' w-full'} disabled={!roomInput} onClick={()=>{setRoom(roomInput);history.replaceState(null,'',location.pathname+'?room='+roomInput)}}>Vào phòng</button></div></div>;
 if(isTeacher)return <div className={outer}><div className="max-w-7xl mx-auto space-y-5">
 <header className={panel+' flex flex-wrap items-center justify-between gap-4'}><div><h1 className="text-xl font-black text-military-gold">CUỘC ĐUA GIẢI MẬT MÃ – GDQPAN 11</h1><p className="text-xs opacity-70">GV: Phan Hoài Như | Trường TH–THCS–THPT Trịnh Hoài Đức (IGC)</p><p className="text-xs text-emerald-300 mt-2">BẢNG ĐIỀU KHIỂN GIÁO VIÊN • Phòng: {room}</p></div><button className={mutedButton} onClick={()=>firebaseAuth.signOut()}>Đăng xuất</button></header>
 {dbError&&<div className="text-red-300">Lỗi Firebase: {dbError}</div>}{notice&&<div className="text-yellow-300 text-sm">{notice}</div>}
 {!data?<div className={panel}><h2 className="text-lg font-bold text-military-gold mb-3">Khởi tạo phòng chơi</h2><p className="text-sm mb-3">Phòng {room} chưa tồn tại hoặc bạn chưa được cấp quyền.</p><button className={goldButton} onClick={initRoom}>Tạo phòng {room}</button></div>:<>
 <div className="grid lg:grid-cols-3 gap-4"><section className={panel}><h2 className="text-military-gold font-bold mb-3">MÃ QR DÀNH CHO HỌC SINH</h2><img id="qr-display" className="w-44 h-44 rounded-lg mx-auto bg-military-gold p-2" alt="QR tham gia"/><p className="text-center font-mono font-bold text-military-gold mt-2">{room}</p><p className="text-xs break-all mt-2">{studentUrl}</p><button className={mutedButton+' mt-3 w-full'} onClick={()=>navigator.clipboard.writeText(studentUrl)}>Sao chép liên kết học sinh</button></section>
 <section className={panel+' lg:col-span-2'}><div className="flex justify-between flex-wrap gap-2 mb-3"><h2 className="font-bold text-military-gold">ĐIỀU KHIỂN CÂU {round}/8</h2><span className="text-xs">{control.phase==='answer'?'Các đội đang trả lời':'Đã công bố từ khóa'}</span></div><div className="grid grid-cols-4 sm:grid-cols-8 gap-2 mb-4">{Array.from({length:8},(_,i)=><div key={i} className={'p-2 text-center rounded-lg font-bold text-sm '+(i+1===round?'bg-military-gold text-military-900':i+1<round?'bg-emerald-700':'bg-military-900')}>{i+1}</div>)}</div><h3 className="text-sm mb-2">{q?.question}</h3><p className="text-xs opacity-70 mb-3">Đã nộp câu {round}: {new Set(roundSubmissions.map(s=>s.teamId)).size}/8 đội</p><div className="flex flex-wrap gap-3"><button className={goldButton} disabled={control.phase!=='answer'} onClick={()=>updateControl('reveal')}>🔑 Công bố từ khóa câu {round}</button>{round<8?<button className={goldButton} disabled={control.phase!=='revealed'} onClick={()=>updateControl('advance')}>➡ Mở câu {round+1} cho 8 đội</button>:<button className={goldButton} disabled={control.phase!=='revealed'||control.secret||!!bonusClaim} onClick={()=>updateControl('secret')}>🔓 GV công bố dự phòng (không thưởng)</button>}</div>{control.phase==='revealed'&&<div className="mt-4 p-4 bg-emerald-800 rounded-lg text-center font-black text-xl">TỪ KHÓA CÂU {round}: {q?.codeWord}</div>}{(control.secret||bonusClaim)&&<div className="mt-4 p-4 bg-yellow-400 rounded-xl text-military-900 font-black text-center text-lg">{SECRET}</div>}</section></div>
 <section className={panel}><p className="text-xs text-emerald-300 mb-3">Thang điểm: 8 câu × 10 điểm; đội nhấn công bố nhanh nhất nhận +20 điểm. {bonusClaim?'Đội '+bonusClaim.teamId+' đã nhận thưởng.':''}</p><div className="flex flex-wrap justify-between gap-3 mb-4"><h2 className="font-bold text-military-gold">TIẾN ĐỘ VÀ ĐIỂM SỐ 8 ĐỘI</h2><button className={mutedButton} onClick={exportCSV}>Xuất CSV</button></div><div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">{scores.map(t=><div key={t.id} className="bg-military-900 border border-military-gold/20 rounded-xl p-3"><p className="text-xs font-bold">{t.name}</p><p className="text-military-gold text-xl font-black mt-1">{t.score} điểm</p><p className="text-xs mt-1 opacity-70">Đã trả lời: {t.count}/8 • Câu hiện tại: {t.answeredRound?'Đã nộp':'Chưa nộp'}</p></div>)}</div></section>
 <section className={panel}><div className="flex flex-wrap justify-between gap-3"><h2 className="text-military-gold font-bold">QUẢN LÝ HÌNH ẢNH CÂU HỎI</h2><button className={mutedButton} onClick={()=>setShowImages(!showImages)}>{showImages?'Ẩn':'Hiện'} quản lý ảnh</button></div>{showImages&&<div className="grid md:grid-cols-2 gap-4 mt-4">{INITIAL_QUESTIONS.map(x=><div key={x.id} className="bg-military-900 p-3 rounded"><p className="text-sm mb-2">Câu {x.id}</p><input type="file" accept="image/*" onChange={e=>uploadImage(x.id,e.target.files[0])} className="text-xs w-full"/><input className="mt-2 w-full bg-military-800 border rounded p-2 text-xs" placeholder="Hoặc dán URL hình ảnh" value={data.questions?.[String(x.id)]?.customImgUrl||''} onChange={e=>roomRef.child('questions/'+x.id+'/customImgUrl').set(e.target.value).catch(err=>setNotice(err.message))}/></div>)}</div>}</section>
 <div className="flex justify-end"><button className="px-4 py-2 bg-red-900 border border-red-400 rounded-lg text-sm font-bold" onClick={reset}>Đặt lại cuộc thi</button></div></>}
 </div></div>;
 // STUDENT
 const currentTeam=scores.find(t=>t.id===teamId);
 if(!data)return <div className={outer}><div className={panel+' max-w-md mx-auto mt-12'}><h1 className="text-xl font-bold text-military-gold mb-2">PHÒNG {room}</h1><p>{dbError?'Lỗi truy cập: '+dbError:'Đang chờ giáo viên tạo phòng...'}</p><button className={mutedButton+' mt-3'} onClick={()=>{setRoom('');history.replaceState(null,'',location.pathname)}}>Nhập mã khác</button></div></div>;
 if(!joined)return <div className={outer}><div className={panel+' max-w-lg mx-auto mt-8 text-center'}><h1 className="text-xl font-black text-military-gold">CHIẾN BINH GIẢI MẬT MÃ</h1><p className="text-sm my-3">Phòng {room} • Chọn đội để tham gia</p><div className="grid grid-cols-2 gap-2 mb-5">{scores.map(t=><button key={t.id} onClick={()=>setTeamId(t.id)} className={'p-3 rounded-lg border text-xs font-bold '+(teamId===t.id?'bg-military-gold text-military-900':'bg-military-900 border-military-gold/30')}>{t.name}</button>)}</div><button className={goldButton+' w-full'} disabled={!teamId} onClick={()=>setJoined(true)}>THAM GIA ĐỘI THI</button><p className="text-xs opacity-60 mt-3">Chỉ giáo viên được điều khiển chuyển câu và công bố mật mã.</p></div></div>;
 return <div className={outer}><div className="max-w-md mx-auto space-y-4"><header className={panel}><p className="text-military-gold font-bold text-sm">{currentTeam?.name}</p><div className="flex justify-between text-sm mt-1"><span>Câu {round}/8</span><span>{currentTeam?.score||0} điểm</span></div></header>
 {(control.secret||bonusClaim)?<section className={panel+' text-center'}><h2 className="text-xl font-black text-military-gold mb-3">HOÀN THÀNH NHIỆM VỤ!</h2><p className="p-4 bg-yellow-400 text-military-900 rounded-lg font-black">{SECRET}</p><p className="mt-3">{bonusClaim?'Đội '+bonusClaim.teamId+' giành 20 điểm thưởng!':'Giáo viên đã công bố thông điệp.'}</p><p className="mt-3">Điểm của đội: {currentTeam?.score}</p></section>:<>
 <section className={panel}><div className="flex justify-between items-center mb-3"><h2 className="text-military-gold font-bold">CÂU HỎI {round}</h2><span className="font-mono text-military-gold">⏱ {seconds}s</span></div><AKPartSVG type={q?.svgType} customImgUrl={q?.customImgUrl}/><h3 className="text-sm font-semibold mt-3 mb-4">{q?.question}</h3><div className="space-y-2">{q?.options?.map((opt,i)=><button key={i} disabled={answered||submitted||control.phase!=='answer'||seconds===0} onClick={()=>sendAnswer(i)} className={'w-full text-left rounded-lg border p-3 text-sm disabled:cursor-not-allowed '+(answered&&Number(mySubmission?.option)===i?'bg-military-gold text-military-900':'bg-military-900 border-military-gold/30')}>{String.fromCharCode(65+i)}. {opt}</button>)}</div></section>
 {notice&&<p className="text-yellow-300 text-xs">{notice}</p>}
 {control.phase==='revealed'?<section className={panel+' text-center'}><h2 className="text-emerald-300 font-bold">GIÁO VIÊN ĐÃ CÔNG BỐ TỪ KHÓA</h2><p className="text-3xl text-military-gold font-black my-3">{q?.codeWord}</p>{round===8?<><p className="text-sm mb-3">Tất cả các đội hãy nhấn thật nhanh để giành 20 điểm!</p><button className={goldButton+' w-full'} disabled={!!bonusClaim||submitted} onClick={claimBonus}>🔓 CÔNG BỐ THÔNG ĐIỆP BÍ MẬT (+20 ĐIỂM)</button></>:<p className="text-sm">Đang chờ giáo viên mở câu {round+1}.</p>}</section>:<section className={panel+' text-center'}><p className="text-sm text-military-gold font-semibold">{answered?'ĐÃ GỬI ĐÁP ÁN':'ĐANG GIẢI MÃ'}</p><p className="text-xs mt-2">{answered?'Vui lòng chờ giáo viên công bố từ khóa.':seconds===0?'Hết giờ trả lời. Chờ giáo viên công bố từ khóa.':'Bạn chỉ có thể gửi một đáp án cho câu này.'}</p></section>}
 </>}
 </div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
